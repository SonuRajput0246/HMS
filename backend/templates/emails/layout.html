<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--  <title>{{ subject }}</title>-->
</head>
<body style="margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; background:#f4f4f4;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <table width="600" cellpadding="0" cellspacing="0" border="0" role="presentation" style="background:#ffffff; border-radius:4px;">

          <tr>
            <td style="padding:24px 24px 24px 24px;">
              <!--
                {{ content }} is inserted with escaping DISABLED because the
                fragment has already had its own placeholders escaped by
                src/api/utils/template_renderer.py. Escaping it a second time
                here would corrupt already-encoded ampersands.

                This is the ONLY place admin-authored markup enters an email.
                Everything visible in the message body lives in the
                message_template column of the message_templates row.
              -->
              {{ content }}
            </td>
          </tr>

          <tr>
            <td style="padding:0 24px 24px 24px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
                <tr>
                  <td style="border-top:1px solid #e6e6e6; padding-top:16px; font-size:12px; color:#8a8a8a; line-height:18px;">
                    <p style="margin:0 0 6px 0;">You are receiving this email because activity occurred on your HMS account.</p>
                    <p style="margin:0;">&copy; {{ year }} HMS. All rights reserved.</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
