<app-navigation-bar [navData]="navData"></app-navigation-bar>

<div class="top-sub-nav-controls">
    <button type="button" mat-raised-button color="primary" routerLink="/hms/roles">
        <mat-icon>arrow_back</mat-icon> Back
    </button>
</div>

<div class="role-access-page">

    <div class="table-card">

        <header class="table-header">
            <div class="table-title">
                <span class="head-icon"><mat-icon>admin_panel_settings</mat-icon></span>
                <div class="head-text">
                    <h3>Feature Access Details</h3>
                    <p>
                        {{ roleObj.role_name || 'Role' }} — tick a category to grant View, then enable
                        the individual operations
                    </p>
                </div>
            </div>

            <div class="filter-controls">
                <div class="access-meta">
                    <span class="meta-chip">
                        <mat-icon>widgets</mat-icon>
                        {{ dataSource.data.length }} modules
                    </span>
                </div>

                <div class="filter-action">
                    <button mat-flat-button class="btn-save" (click)="updateRoleAccessList()" [disabled]="isLoading">
                        <span class="btn-content" *ngIf="!isLoading">
                            <mat-icon>save</mat-icon> Update Access
                        </span>
                        <span class="btn-content" *ngIf="isLoading">
                            Please Wait
                            <mat-progress-spinner diameter="18" mode="indeterminate" class="btn-spinner">
                            </mat-progress-spinner>
                        </span>
                    </button>
                </div>
            </div>
        </header>

        <div class="table-scroll">
            <ng-container *ngIf="!isPageLoad">
                <table mat-table [dataSource]="dataSource" class="role-access-table">

                    <ng-container matColumnDef="menuname">
                        <th mat-header-cell *matHeaderCellDef style="width: 32%;"> Category </th>
                        <td mat-cell *matCellDef="let element">
                            <div class="category-cell" [class.is-child]="element.menu_parent_code !== 0">
                                <mat-checkbox
                                    class="category-check"
                                    color="primary"
                                    [(ngModel)]="element.is_active"
                                    [disabled]="isParentDisabled(element)"
                                    (change)="onModuleToggle(element)">
                                </mat-checkbox>
                                <span class="category-name"
                                    [class.is-parent]="element.menu_parent_code === 0">
                                    {{ element.module_display_name }}
                                </span>
                            </div>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="events">
                        <th mat-header-cell *matHeaderCellDef style="width: 68%;"> Permissions </th>
                        <td mat-cell *matCellDef="let element">
                            <div class="checkbox-container">
                                <ng-container *ngFor="let access of element.access_json">
                                    <div class="checkbox-item" *ngIf="access.operation_key !== 'View'">
                                        <mat-checkbox
                                            class="permission-check"
                                            color="accent"
                                            [(ngModel)]="access.value"
                                            [disabled]="!element.is_active || isParentDisabled(element)">
                                        </mat-checkbox>
                                        <label>{{ access.key }}</label>
                                    </div>
                                </ng-container>
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <tr mat-no-data-row *matNoDataRow>
                        <td class="no-data" [attr.colspan]="displayedColumns.length">
                            <mat-icon>lock_open</mat-icon>
                            <span>No modules available to configure.</span>
                        </td>
                    </tr>
                </table>
            </ng-container>
        </div>
    </div>

</div>

<app-page-loader *ngIf="isPageLoad"></app-page-loader>
