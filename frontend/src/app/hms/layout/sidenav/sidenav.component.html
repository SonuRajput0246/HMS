<mat-nav-list>
    <div *ngFor="let item of menuItems">
        <a *ngIf="item.menu_parent_code==0" mat-list-item [routerLinkActive]="'active'" [ngClass]="'ActiveMenu'">
            <span class="Parent_menu_text" (click)="onMenuLoad(item)">
                <img class="sidenav-icon" [src]="'/assets/menu_icons/'+item.icon">
            </span>
            <span class="example-fill-remaining-space"></span>
            <div class="menu_name_div" (click)="onMenuLoad(item)">
                {{ item.module_display_name }}
            </div>
        </a>
    </div>
</mat-nav-list>
