<nav class="cms-sidenav" aria-label="Cafe sections">
    <a *ngFor="let item of menu"
       mat-list-item
       class="cms-menu-item"
       [routerLink]="urlFor(item)"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: item.entry.exact }">
        <img *ngIf="item.icon; else noIcon"
             class="cms-menu-icon"
             [src]="'/assets/menu_icons/' + item.icon"
             alt=""
             aria-hidden="true" />
        <ng-template #noIcon><mat-icon class="cms-menu-icon">circle</mat-icon></ng-template>
        <span class="cms-menu-label">{{ item.displayName }}</span>
    </a>

    <p class="cms-sidenav-empty" *ngIf="menu.length === 0">
        No sections are available to your role.
    </p>
</nav>
