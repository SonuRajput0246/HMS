<swiper-container
  class="mySwiper"
  pagination
  pagination-clickable
  navigation
  rewind
  slides-per-view="1"
  space-between="30"
  autoplay-delay="2500"
  autoplay-disable-on-interaction="false">

<swiper-slide *ngFor="let slide of slides; trackBy: trackByIndex">
  <img [src]="slide.image_path" [alt]="slide.alt_text">
</swiper-slide>

</swiper-container>
