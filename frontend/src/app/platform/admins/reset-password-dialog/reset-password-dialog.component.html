<h2 mat-dialog-title>Reset password</h2>

<mat-dialog-content>
  <p class="dialog-intro">
    Set a new password for <b>{{ admin.first_name }} {{ admin.last_name }}</b>
    ({{ admin.email }}). They will be signed out everywhere and can use it to sign in again.
  </p>

  <form [formGroup]="form" class="dialog-form" (ngSubmit)="save()">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>New password</mat-label>
      <input matInput type="password" formControlName="new_password" autocomplete="new-password">
      <mat-hint>6–20 characters</mat-hint>
      <mat-error *ngIf="form.get('new_password')?.hasError('required')">Password is required</mat-error>
      <mat-error *ngIf="form.get('new_password')?.hasError('minlength') || form.get('new_password')?.hasError('maxlength')">
        Password must be 6–20 characters
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Confirm password</mat-label>
      <input matInput type="password" formControlName="confirm_password" autocomplete="new-password">
      <mat-error *ngIf="form.hasError('mismatch') && form.get('confirm_password')?.touched">
        Passwords do not match
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()" [disabled]="isSaving">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="isSaving">
    {{ isSaving ? 'Resetting...' : 'Reset password' }}
  </button>
</mat-dialog-actions>
